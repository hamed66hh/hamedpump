class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e}; }
  render(){
    if(this.state.err){
      return React.createElement('div',{style:{padding:20,color:'#fca5a5',fontFamily:'Tahoma',direction:'rtl'}},

    }
    return this.props.children;
  }
}

async function fetchJSON(url, retries){
  if(retries===undefined)retries=CONFIG.RETRY;
  let lastErr=null;
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(url);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      lastErr=e;
      if(i<retries) await new Promise(res=>setTimeout(res,1500*(i+1)));
    }
  }
  throw lastErr;
}

function fmtPrice(p){ if(p===null||p===undefined||p==='')return'-'; const v=+p; if(v>=1000)return'$'+v.toLocaleString('en-US',{maximumFractionDigits:0}); if(v>=1)return'$'+v.toFixed(2); if(v>=0.01)return'$'+v.toFixed(4); return'$'+v.toPrecision(3); }
function fmtUsd(v){ if(!v)return'$0'; if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B'; if(v>=1e6)return'$'+(v/1e6).toFixed(1)+'M'; if(v>=1e3)return'$'+(v/1e3).toFixed(1)+'K'; return'$'+Math.round(v); }

function playAlertSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ctx=new AC();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);
    o.start(ctx.currentTime); o.stop(ctx.currentTime+0.5);
  }catch(e){}
}

function computeRiskMode(global, chains){
  let score=50;
  if(global){ score += (global.market_cap_change_percentage_24h_usd||0)*4; }
  if(chains&&chains.length){
    const avg=chains.reduce(function(s,c){return s+(c.chg||0);},0)/chains.length;
    score += avg*2;
  }
  if(global&&global.market_cap_percentage&&global.market_cap_percentage.btc>55){ score-=5; }
  return clamp(Math.round(score),0,100);
}

  if(v>=65)return {label:'🟢 ریسک‌پذیر',color:'#10b981'};
  if(v>=40)return {label:'🟡 خنثی',color:'#f59e0b'};
  return {label:'🔴 ریسک‌گریز',color:'#ef4444'};
}
function calcComposite(it, sec, pro, ee, confl, riskVal){
  let c=0;
  c += (it.score||0)*0.25;
  c += (ee? ee.score:0)*0.25;
  const secScore = sec? (100-sec.risk):50;
  c += secScore*0.20;
  c += Math.min(100,(confl||0)*25)*0.15;
  c += (riskVal||50)*0.15;
  return clamp(Math.round(c),0,100);
}
function calcPlan(it){
  const entry=it.price||0;
  if(!entry)return null;
  const sl=entry*0.85;
  const tp2=entry*1.5;
  const risk=entry-sl;
  const reward=tp2-entry;
  const rr= risk>0? (reward/risk):0;
  const liq=it.liq||0;
  const slip= liq>0? Math.min(50,(1000/liq)*100):50;
  return {entry:entry,sl:sl,tp2:tp2,rr:rr,slip:slip,liqOk:slip<5};
}
function buildChecklist(it, sec, pro, plan, confl, riskOn, riskInfo, chainSupported){
  const rows=[];
  if(sec && sec.checked){
    if(sec.dangerous) rows.push({lvl:'bad',t:'امنیت: خطرناک (ریسک '+sec.risk+')'});
    else if(sec.safe) rows.push({lvl:'ok',t:'امنیت: امن (ریسک '+sec.risk+')'});
    else rows.push({lvl:'warn',t:'امنیت: متوسط (ریسک '+sec.risk+')'});
  } else {
    rows.push({lvl:'na',t: chainSupported? 'امنیت: هنوز چک نشده' : 'امنیت: برای این زنجیره در دسترس نیست'});
  }
  if(pro && pro.sellable===true) rows.push({lvl:'ok',t:'قابل‌فروش بودن: تأیید (Jupiter)'});
  else if(pro && pro.sellable===false) rows.push({lvl:'bad',t:'قابل‌فروش بودن: غیرقابل فروش!'});
  else if(pro && pro.evmSellable===true) rows.push({lvl:'ok',t:'مسیر فروش وجود دارد (شبیه‌سازی EVM)'});
  else if(pro && pro.evmSellable===false) rows.push({lvl:'bad',t:'مسیر فروش پیدا نشد (شبیه‌سازی EVM)'});
  else rows.push({lvl:'na',t:'قابل‌فروش بودن: نامشخص'});
  const liq=it.liq||0;
  if(liq>=25000) rows.push({lvl:'ok',t:'نقدینگی: عالی ('+fmtUsd(liq)+')'});
  else if(liq>=10000) rows.push({lvl:'ok',t:'نقدینگی: خوب ('+fmtUsd(liq)+')'});
  else if(liq>=5000) rows.push({lvl:'warn',t:'نقدینگی: کم ('+fmtUsd(liq)+')'});
  else rows.push({lvl:'bad',t:'نقدینگی: خیلی کم ('+fmtUsd(liq)+')'});
  if(plan){
    if(plan.slip<1) rows.push({lvl:'ok',t:'اسلیپیج تخمینی: '+plan.slip.toFixed(1)+'%'});
    else if(plan.slip<5) rows.push({lvl:'warn',t:'اسلیپیج تخمینی: '+plan.slip.toFixed(1)+'%'});
    else rows.push({lvl:'bad',t:'اسلیپیج تخمینی: '+plan.slip.toFixed(1)+'% (خیلی بالا)'});
  }
  if(pro && pro.concentration!==undefined){
    const cc=pro.concentration;
    if(cc<0.5) rows.push({lvl:'ok',t:'تمرکز هولدرها: '+Math.round(cc*100)+'%'});
    else if(cc<0.7) rows.push({lvl:'warn',t:'تمرکز هولدرها: '+Math.round(cc*100)+'%'});
    else rows.push({lvl:'bad',t:'تمرکز هولدرها: '+Math.round(cc*100)+'% (خیلی بالا)'});
  }
  if(confl>0) rows.push({lvl:'ok',t:confl+' کیف‌پول هوشمند روی این توکن'});
  else rows.push({lvl:'na',t:'تأیید نهنگ: ندارد'});
  rows.push({lvl: riskOn? (riskInfo.color==='#10b981'?'ok': riskInfo.color==='#f59e0b'?'warn':'bad') : 'na', t:'بازار: '+riskInfo.label+(riskOn?'':' (غیرفعال دستی)')});
  if(plan) rows.push({lvl:'warn',t:'پیشنهاد: فقط ۱-۲٪ سرمایه + SL روی '+fmtPrice(plan.sl)});
  const bad=rows.filter(function(r){return r.lvl==='bad';}).length;
  const warn=rows.filter(function(r){return r.lvl==='warn';}).length;
  let verdict, vlvl;
  if(bad>0){ verdict='🚨 نخر: '+bad+' مورد خطرناک'; vlvl='bad'; }
  else if(warn>0){ verdict='⚠️ با احتیاط و حجم خیلی کم بخر'; vlvl='warn'; }
  else { verdict='✅ شرایط نسبتاً خوب (هنوز تضمین نیست)'; vlvl='ok'; }
  rows.forEach(function(r){ r.icon=lvlIcon(r.lvl); });
  return {rows:rows, verdict:verdict, vlvl:vlvl};
}

function calcEarlyEntryScore(it, sec, pro){
  let score=0;
  const reasons=[];
  if(sec && sec.dangerous) return {score:0, blocked:true, signals:[]};
  if(pro && pro.sellable===false) return {score:0, blocked:true, signals:[]};
  if(it.ageMs){
    const ageMin=it.ageMs/60000;
    if(ageMin<30){score+=25;reasons.push('خیلی تازه');}
    else if(ageMin<60){score+=20;reasons.push('تازه');}
    else if(ageMin<180){score+=12;}
    else{score+=5;}
  }
  if(sec && sec.checked){
    if(sec.safe){score+=30;reasons.push('امنیت تأیید');}
    else{score+=15;}
  } else { score+=10; }
  if(pro && pro.sellable===true){score+=10;reasons.push('قابل فروش');}
  if(pro && pro.concentration>0.7){score-=15;reasons.push('تمرکز بالا');}
  if(it.signals){
    it.signals.forEach(function(s){
      if(s.label.indexOf('حجم')>-1||s.label.indexOf('اسپایک')>-1){score+=10;reasons.push('حجم قوی');}
      if(s.label.indexOf('خرید')>-1){score+=10;reasons.push('فشار خرید');}
      if(s.label.indexOf('مومنتوم')>-1||s.label.indexOf('شتاب')>-1){score+=8;reasons.push('مومنتوم');}
    });
  }
  if(it.liq>=25000){score+=10;}
  else if(it.liq>=10000){score+=7;}
  else if(it.liq>=5000){score+=4;}
  score+=Math.min(10, Math.floor((it.score||0)/10));
  return {score:Math.min(100,score), blocked:false, signals:reasons};
}

function calcTrustDex(p){
  let t=0; const badges=[];
  const liq=(p.liquidity&&p.liquidity.usd)||p.liq||0;
  if(liq>=25000){t+=30;badges.push({icon:'💎',label:'نقدینگی عالی'});}
  else if(liq>=10000){t+=22;badges.push({icon:'💎',label:'نقدینگی خوب'});}
  else if(liq>=5000){t+=12;badges.push({icon:'💎',label:'نقدینگی قابل قبول'});}
  let social=0;
  if(p.info&&p.info.websites&&p.info.websites.length){social++;badges.push({icon:'🌐',label:'وب‌سایت'});}
  const types=((p.info&&p.info.socials)||[]).map(function(s){return s.type;});
  if(types.indexOf('twitter')>-1){social++;badges.push({icon:'🐦',label:'توییتر'});}
  if(types.indexOf('telegram')>-1){social++;badges.push({icon:'✈️',label:'تلگرام'});}
  t+=Math.min(20,social*10);
  const boosts=(p.boosts&&p.boosts.total)||0;
  if(boosts>=10){t+=10;}else if(boosts>=3){t+=6;}else if(boosts>=1){t+=3;}
  const fdv=p.fdv||0; if(fdv>=1e5&&fdv<=1e7){t+=10;}
  const tx=(((p.txns&&p.txns.h1)&&p.txns.h1.buys)||0)+(((p.txns&&p.txns.h1)&&p.txns.h1.sells)||0)||(((p.txns&&p.txns.m5)&&p.txns.m5.buys)||0)+(((p.txns&&p.txns.m5)&&p.txns.m5.sells)||0);
  if(tx>=500){t+=10;}else if(tx>=200){t+=6;}else if(tx>=100){t+=3;}
  return {trust:clamp(t,0,100),badges:badges};
}

function categorize(c){
  const s=new Set();

    return {key:'llama_'+c.name,name:c.name,tvl:c.tvl,chg:chg,symbol:c.tokenSymbol||''};
  });
}

                  const secAge= sec? Math.max(0,Math.round((now-sec.ts)/60000)) : 0;
                  const isSolChain= String(it.chain||'').toLowerCase().indexOf('sol')>-1;
                  const chainSupported= isSolChain || !!CHAIN_TO_GORPLUS_ID[String(it.chain||'').toLowerCase()];
                  const expUrl= explorerUrl(it.chain,it.contractAddress);
                  const cl= checklistOpen===it.key? buildChecklist(it,sec,pro,plan,confl,riskModeOn,riskModeOn?riskModeLabel(riskVal):{label:'غیرفعال',color:'#6b7280'},chainSupported) : null;
                  const dispPrice= (pro&&pro.price)? pro.price : it.price;
                  const borderColor= isNew ? 'rgba(34,211,238,.5)' : ((it.score||0)>=70 ? 'rgba(251,191,36,.4)' : 'rgba(255,255,255,.08)');
                  return (
                    <div key={it.key} onClick={function(){openItem(it);}} className="glass rounded-xl p-3.5 relative overflow-hidden coin-card cursor-pointer" style={{border:'1px solid '+borderColor}}>
                      {(isNew||(it.score||0)>=70) && <div className="absolute top-0 left-0 right-0 h-0.5" style={{background:'linear-gradient(90deg,#fbbf24,#22d3ee)'}}/>}
                      <div className="flex justify-between items-start mb-2">
                        <div className="flex items-center gap-2.5">
                          {it.icon?<img src={it.icon} className="w-10 h-10 rounded-full" style={{border:'2px solid '+cs.border}}/>:<div className="w-10 h-10 rounded-full flex items-center justify-center text-xs font-black" style={{background:cs.bg,border:'2px solid '+cs.border,color:cs.text}}>{it.symbol.substring(0,3)}</div>}
                          <div>
                            <div className="font-bold text-sm flex items-center gap-1.5">
                              <span className="tnum text-gray-500 text-[10px]">#{idx+1}</span>{it.symbol}
                              {isNew && <span className="new-badge text-[9px] px-1.5 py-0.5 rounded" style={{color:'#67e8f9',border:'1px solid rgba(34,211,238,.4)'}}>🆕</span>}
                              <span className="text-[9px] px-1.5 py-0.5 rounded font-bold" style={{background:'rgba(139,92,246,.15)',border:'1px solid rgba(139,92,246,.4)',color:'#c4b5fd'}}>🧠{comp}</span>
                            </div>
                            <div className="text-[10px] text-gray-500 mt-0.5 flex items-center gap-1.5">
                              {it.ageMs?('🍼 '+fmtAge(it.ageMs)):'🏦'}
                              <span className="px-1.5 py-0.5 rounded" style={{background:cs.bg,color:cs.text,border:'1px solid '+cs.border}}>{cs.label}</span>
                              <span className="px-1.5 py-0.5 rounded" style={{background:'rgba(255,255,255,.05)',color:'#9ca3af'}}>{it.dex}</span>
                            </div>
                            {ageLabel && <div className="text-[9px] text-gray-400 mt-0.5">{ageLabel}</div>}
                          </div>
                        </div>
                        <div className="text-left flex gap-2 items-start">
                          <button onClick={function(ev){ev.stopPropagation();toggleWatchToken(it.key);}} className="text-[14px]" style={{color:pinned?'#fbbf24':'#6b7280'}}>{pinned?'⭐':'☆'}</button>
                          <div><div className="text-xl font-black tnum" style={{color}}>{it.score||0}</div><div className="text-[9px] text-gray-500">سیگنال</div></div>
                          <div><div className="text-xl font-black tnum" style={{color:'#22d3ee'}}>🛡{it.trust||0}</div><div className="text-[9px] text-gray-500">اطمینان</div></div>
                        </div>
                      </div>

                      {ee && ee.score>=50 && (
                        <div className="mb-2 p-2 rounded-lg" style={{background:'rgba(34,211,238,.08)',border:'1px solid rgba(34,211,238,.25)'}}>
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-bold" style={{color:'#67e8f9'}}>🚀 امتیاز ورود زودهنگام</span>
                            <span className="text-[13px] font-black tnum" style={{color: ee.score>=80?'#10b981':(ee.score>=60?'#f59e0b':'#3b82f6')}}>{ee.score}</span>
                          </div>
                        </div>
                      )}

                      {plan && it.kind==='birth' && (
                        <div className="mb-2 p-2 rounded-lg text-[9px] tnum" style={{background:'rgba(251,191,36,.06)',border:'1px solid rgba(251,191,36,.2)',color:'#fde68a'}}>
                          🎯 ورود {fmtPrice(plan.entry)} | SL {fmtPrice(plan.sl)} | TP {fmtPrice(plan.tp2)} | R/R {plan.rr.toFixed(1)} | اسلیپ {plan.slip.toFixed(1)}%{plan.liqOk?'':' ⚠️'}
                        </div>
                      )}

                      {shown.length>0 && <div className="flex gap-1.5 flex-wrap mb-2">{shown.map(function(sg,i){
                        return <span key={i} className="px-2 py-1 rounded-md text-[10px] font-semibold" style={{background:sg.label.indexOf('فشار فروش')>-1?'rgba(239,68,68,.15)':'rgba(251,191,36,.12)',border:'1px solid '+(sg.label.indexOf('فشار فروش')>-1?'rgba(239,68,68,.3)':'rgba(251,191,36,.3)'),color:sg.label.indexOf('فشار فروش')>-1?'#fca5a5':'#fde68a'}}>{sg.icon} {sg.label}</span>;
                      })}</div>}
                      <div className="grid grid-cols-4 gap-1.5 text-center">
                        <div className="rounded-lg py-1.5" style={{background:'rgba(0,0,0,.3)'}}><div className="text-[9px] text-gray-500">قیمت</div><div className="text-[11px] font-bold tnum">{fmtPrice(dispPrice)}</div></div>
                        <div className="rounded-lg py-1.5" style={{background:'rgba(0,0,0,.3)'}}><div className="text-[9px] text-gray-500">حجم ۲۴س</div><div className="text-[11px] font-bold tnum">{fmtUsd((it.vol1||0)*12)}</div></div>
                        <div className="rounded-lg py-1.5" style={{background:'rgba(0,0,0,.3)'}}><div className="text-[9px] text-gray-500">حجم ۵د</div><div className="text-[11px] font-bold tnum">{fmtUsd(it.vol5||0)}</div></div>
                        <div className="rounded-lg py-1.5" style={{background:'rgba(0,0,0,.3)'}}><div className="text-[9px] text-gray-500">۲۴س</div><div className="text-[11px] font-bold tnum" style={{color:(it.chg1||0)>=0?'#10b981':'#ef4444'}}>{(it.chg1||0)>=0?'+':''}{(it.chg1||0).toFixed(2)}%</div></div>
                      </div>

                      {it.contractAddress && sec && sec.checked && (
                        <div className="mt-2 pt-2" style={{borderTop:'1px solid rgba(255,255,255,.08)'}}>
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-[10px] font-bold" style={{color:'#a5f3fc'}}>🛡️ بررسی امنیت <span className="text-[9px] font-normal text-gray-500 tnum">({secAge}د پیش)</span></span>
                            <div className="flex items-center gap-1">
                              <button onClick={function(ev){ev.stopPropagation();forceRecheck(it.key);}} className="text-[10px] px-1.5 py-0.5 rounded" style={{background:'rgba(34,211,238,.1)',border:'1px solid rgba(34,211,238,.3)',color:'#a5f3fc'}}>🔄</button>
                              <span className="text-[9px] px-1.5 py-0.5 rounded font-bold" style={{
                                background: sec.dangerous?'rgba(239,68,68,.2)':(sec.safe?'rgba(16,185,129,.2)':'rgba(251,191,36,.2)'),
                                color: sec.dangerous?'#fca5a5':(sec.safe?'#86efac':'#fde68a'),
                                border:'1px solid '+(sec.dangerous?'rgba(239,68,68,.4)':(sec.safe?'rgba(16,185,129,.4)':'rgba(251,191,36,.4)'))
                              }}>{sec.dangerous?'🚨 خطرناک':(sec.safe?'✅ امن':'⚠️ متوسط')} ({sec.risk})</span>
                            </div>
                          </div>
                          <div className="flex gap-1 flex-wrap">
                            {sec.signals.slice(0,4).map(function(s,i){
                              return <span key={i} className="text-[9px] px-1.5 py-0.5 rounded" style={{
                                background: s.danger?'rgba(239,68,68,.15)':(s.good?'rgba(16,185,129,.15)':'rgba(251,191,36,.12)'),
                                border:'1px solid '+(s.danger?'rgba(239,68,68,.3)':(s.good?'rgba(16,185,129,.3)':'rgba(251,191,36,.3)')),
                                color: s.danger?'#fca5a5':(s.good?'#86efac':'#fde68a'),
                              }}>{s.icon} {s.label}</span>;
                            })}
                          </div>
                        </div>
                      )}

                      {it.contractAddress && it.kind==='birth' && (!sec || !sec.checked) && (
                        <div className="mt-2 pt-2" style={{borderTop:'1px solid rgba(255,255,255,.08)'}}>
                          <span className="text-[9px] px-1.5 py-0.5 rounded" style={{background:'rgba(107,114,128,.15)',border:'1px solid rgba(107,114,128,.3)',color:'#9ca3af'}}>
                            {chainSupported? '🛡️ بررسی امنیت: در حال بررسی...' : '🛡️ بررسی امنیت: برای این زنجیره در دسترس نیست'}
                          </span>
                        </div>
                      )}

                      {cl && (
                        <div className="mt-2 p-2 rounded-lg" style={{background:'rgba(0,0,0,.35)',border:'1px solid rgba(255,255,255,.1)'}}>
                          <div className="text-[10px] font-bold mb-1" style={{color:'#fde68a'}}>📋 چک‌لیست خرید</div>
                          {cl.rows.map(function(r,i){
                            return <div key={i} className="flex items-center gap-1 text-[9px] py-0.5" style={{color:lvlColor(r.lvl)}}>{r.icon} {r.t}</div>;
                          })}
                          <div className="mt-1 text-[10px] font-bold" style={{color:lvlColor(cl.vlvl)}}>{cl.verdict}</div>
                        </div>
                      )}

                      {it.contractAddress && (
                        <div className="flex gap-1 flex-wrap mt-2">
                          <button onClick={function(ev){ev.stopPropagation(); setChecklistOpen(checklistOpen===it.key? null : it.key);}} className="text-[9px] px-2 py-1 rounded font-bold" style={{background:checklistOpen===it.key?'rgba(251,191,36,.2)':'rgba(251,191,36,.08)',border:'1px solid rgba(251,191,36,.3)',color:'#fde68a'}}>📋 چک‌لیست</button>
                          {it.url && <button onClick={function(ev){ev.stopPropagation();window.open(it.url,'_blank');}} className="text-[9px] px-2 py-1 rounded" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#9ca3af'}}>📊 DexScreener</button>}
                          {expUrl && <button onClick={function(ev){ev.stopPropagation();window.open(expUrl,'_blank');}} className="text-[9px] px-2 py-1 rounded" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#9ca3af'}}>🔍 Explorer</button>}
                          {isSolChain && <button onClick={function(ev){ev.stopPropagation();window.open('https://rugcheck.xyz/tokens/'+it.contractAddress,'_blank');}} className="text-[9px] px-2 py-1 rounded" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#9ca3af'}}>🦎 RugCheck</button>}
                          <button onClick={function(ev){ev.stopPropagation(); if(copyText(it.contractAddress)) flash('📋 آدرس کپی شد');}} className="text-[9px] px-2 py-1 rounded" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#9ca3af'}}>📋 کپی آدرس</button>
                        </div>
                      )}

                      {pro && (pro.price!==undefined||pro.sellable!==undefined||pro.concentration!==undefined||pro.evmSellable!==undefined) && (
                        <div className="mt-2 pt-2" style={{borderTop:'1px solid rgba(255,255,255,.08)'}}>
                          <div className="text-[10px] font-bold mb-1" style={{color:'#67e8f9'}}>🚀 Solana Pro / شبیه‌سازی</div>
                          <div className="flex gap-1 flex-wrap">
                            {pro.sellable===true && <span className="text-[9px] px-1.5 py-0.5 rounded" style={{background:'rgba(16,185,129,.15)',border:'1px solid rgba(16,185,129,.3)',color:'#86efac'}}>✅ قابل فروش (Jupiter)</span>}
                            {pro.sellable===false && <span className="text-[9px] px-1.5 py-0.5 rounded" style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',color:'#fca5a5'}}>🚨 غیرقابل فروش</span>}
                            {pro.evmSellable===true && <span className="text-[9px] px-1.5 py-0.5 rounded" style={{background:'rgba(16,185,129,.15)',border:'1px solid rgba(16,185,129,.3)',color:'#86efac'}}>✅ مسیر فروش (EVM)</span>}
                            {pro.evmSellable===false && <span className="text-[9px] px-1.5 py-0.5 rounded" style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',color:'#fca5a5'}}>🚨 بدون مسیر فروش (EVM)</span>}
                            {pro.concentration!==undefined && (
                              <span className="text-[9px] px-1.5 py-0.5 rounded" style={{
                                background: pro.concentration>0.6?'rgba(239,68,68,.15)':'rgba(16,185,129,.15)',
                                border:'1px solid '+(pro.concentration>0.6?'rgba(239,68,68,.3)':'rgba(16,185,129,.3)'),
                                color: pro.concentration>0.6?'#fca5a5':'#86efac',
                              }}>{pro.concentration>0.6?'🚨':''} تمرکز هولدر {Math.round(pro.concentration*100)}%</span>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {isAll && filtered.length>displayCount && (
              <button onClick={function(){setDisplayCount(function(p){return p+CONFIG.LOAD_MORE_STEP;});}} className="w-full mt-3 py-3 rounded-xl text-sm font-bold" style={{background:'linear-gradient(120deg,rgba(251,191,36,.15),rgba(34,211,238,.1))',border:'1px solid rgba(251,191,36,.3)',color:'#fde68a'}}>نمایش بیشتر ({filtered.length-displayCount})</button>
            )}
          </div>
        )}

        {chains.length>0 && !isAssist && (
          <div className="mt-4 glass rounded-xl p-3" style={{border:'1px solid rgba(16,185,129,.2)'}}>
            <div className="font-bold text-xs mb-2" style={{color:'#10b981'}}>💰 جریان TVL زنجیره‌ها (DeFiLlama)</div>
            <div className="flex gap-2 overflow-x-auto scrollbar-hide">
              {chains.map(function(c){
                return <div key={c.key} className="px-3 py-2 rounded-lg whitespace-nowrap" style={{background:'rgba(0,0,0,.3)'}}>
                  <div className="text-[11px] font-bold">{c.name}</div>
                  <div className="text-[10px] tnum text-gray-400">{fmtUsd(c.tvl)}</div>
                  <div className="text-[10px] tnum" style={{color:c.chg>=0?'#10b981':'#ef4444'}}>{c.chg>=0?'+':''}{c.chg.toFixed(2)}%</div>
                </div>;
              })}
            </div>
          </div>
        )}

        {live.length>0 && !isAssist && (
          <div className="mt-3 glass rounded-xl p-3" style={{border:'1px solid rgba(34,211,238,.2)'}}>
            <div className="font-bold text-xs mb-2" style={{color:'#22d3ee'}}>⚡ بیشترین رشد ۲۴س زنده (Binance)</div>
            <div className="flex gap-2 overflow-x-auto scrollbar-hide">
              {live.map(function(l){
                return <div key={l.id} className="px-3 py-2 rounded-lg whitespace-nowrap" style={{background:'rgba(0,0,0,.3)'}}>
                  <div className="text-[11px] font-bold">{l.id.replace('USDT','')}</div>
                  <div className="text-[10px] tnum text-gray-400">{fmtPrice(l.price)}</div>
                  <div className="text-[10px] tnum" style={{color:'#10b981'}}>+{(l.chg||0).toFixed(2)}%</div>
                </div>;
              })}
            </div>
          </div>
        )}

        <div className="mt-4 p-3 rounded-xl text-[10px] text-gray-500 leading-relaxed glass">
          <div className="font-bold text-amber-300 mb-1"> فاز ۱ تا ۶ + ۵ اصلاح جزئی فعال:</div>
          <div>• 📋 چک‌لیست خرید • 🧪 تست فروش EVM • 💾 ذخیره بک‌تست • 🌗 کلید ریسک‌بازار • 🌐 زنجیره‌های بیشتر</div>
          <div className="mt-2 italic">⚠️ توصیه معاملاتی نیست.</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
  <script>
(function(){
  function show(sb){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;bottom:10px;left:10px;right:10px;z-index:60;background:rgba(5,7,15,.94);border:1px solid rgba(34,211,238,.4);border-radius:12px;padding:10px;font-family:Tahoma,sans-serif;direction:rtl;color:#f1f5f9;font-size:11px;';
    d.innerHTML='🖥️ بک‌تست سرور ۲۴/۷: '+sb.total+' سیگنال • برد '+sb.wins+' ('+sb.winRate+'%)';
    document.body.appendChild(d);
    setTimeout(function(){ if(d&&d.parentNode)d.parentNode.removeChild(d); },8000);
  }
  fetch('/api/backtest').then(function(r){ if(!r.ok)throw 0; return r.json(); }).then(function(sb){ if(sb&&sb.total>0)show(sb); }).catch(function(){});
})();
</script>
</body>
</html>
